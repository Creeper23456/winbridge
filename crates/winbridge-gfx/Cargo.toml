# SPDX-License-Identifier: GPL-3.0-or-later
[package]
name = "winbridge-gfx"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Host side of the WinBridge GPU forwarding channel: executes forwarded Vulkan calls on the Linux driver"

[lib]
name = "winbridge_gfx"

[[bin]]
name = "winbridge-gfx"
path = "src/main.rs"

[dependencies]
ash = "0.38"
winbridge-gfx-proto = { path = "../winbridge-gfx-proto" }
winbridge-gfx-vk = { path = "../winbridge-gfx-vk", features = ["host"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
