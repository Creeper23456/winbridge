[package]
name = "winbridge-gfx-vk"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Generated Vulkan serializers and host dispatcher for the WinBridge GPU forwarding channel"

[features]
# `guest`: request encoders and reply decoders used by the Windows ICD.
# `host`: request decoders and the dispatcher used by the Linux renderer.
guest = []
host = []

[dependencies]
ash = { version = "0.38", default-features = false, features = ["std"] }
winbridge-gfx-proto = { path = "../winbridge-gfx-proto" }

[dev-dependencies]
winbridge-gfx-vk = { path = ".", features = ["guest", "host"] }
