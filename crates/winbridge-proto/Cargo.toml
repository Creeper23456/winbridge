[package]
name = "winbridge-proto"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared wire protocol and serialization for WinBridge"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
thiserror = "2.0"
tracing = "0.1"
winbridge-shm = { path = "../winbridge-shm" }
tokio = { version = "1", features = ["io-util"], optional = true }

[features]
default = ["tokio"]
tokio = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
