[package]
name = "winbridge-gfx-icd"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "User-mode Vulkan ICD that forwards calls to the WinBridge host over virtio-serial"

[lib]
name = "winbridge_gfx_icd"
crate-type = ["cdylib", "rlib"]

[dependencies]
ash = { version = "0.38", default-features = false, features = ["std"] }
winbridge-gfx-proto = { path = "../winbridge-gfx-proto" }
winbridge-gfx-vk = { path = "../winbridge-gfx-vk", features = ["guest"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
