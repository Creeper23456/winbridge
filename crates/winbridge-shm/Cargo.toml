[package]
name = "winbridge-shm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared-memory (ivshmem) lane transport core for WinBridge"

# The core needs only `core`/`std` and builds for x86_64-pc-windows-msvc with the static CRT.
# The file mapping of the host side (`file`) exists on Unix only.
[target.'cfg(unix)'.dependencies]
libc = "0.2"
memmap2 = "0.9"
