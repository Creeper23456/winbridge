[package]
name = "winbridge-host"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux GTK4 viewer and bridge host for Windows 11 QEMU guest"

[dependencies]
winbridge-proto = { path = "../winbridge-proto", features = ["tokio"] }
winbridge-shm = { path = "../winbridge-shm" }
gtk4 = { version = "0.11", features = ["v4_18"] }
gdk4-x11 = { version = "0.11", features = ["v4_18", "xlib"] }
x11-dl = "2"
zbus = { version = "5.5", features = ["p2p", "tokio"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1"
libc = "0.2"
ksni = "0.3"
