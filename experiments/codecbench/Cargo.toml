[package]
name = "codecbench"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# `gen` (host-side frame synthesis and encoders) is on by default; the guest only needs `decode`/`tail`:
#   cargo build --release --no-default-features
default = ["gen"]
gen = ["dep:image", "dep:texpresso", "dep:jpeg-encoder"]

[dependencies]
lz4_flex = "0.14"
zstd = "0.13"
zune-jpeg = "0.5"
zune-core = "0.5"
texture2ddecoder = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }
texpresso = { version = "2", optional = true }
jpeg-encoder = { version = "0.7", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
